<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melody para colorear · Aventuras Kuska</title>
  <link rel="icon" href="favicon.png">
  <style>
    @page { size: auto; margin: 10mm; }
    html, body { margin:0; background:#fff; }
    img { display:block; margin:0 auto; max-width:100%; max-height:100vh; width:auto; height:auto; }
    .bar { text-align:center; padding:12px; font-family: system-ui, sans-serif; }
    .bar button { font:inherit; font-weight:700; padding:12px 20px; border-radius:999px; border:0; background:#3D6650; color:#fff; cursor:pointer; }
    @media print { .bar { display:none; } img { max-height:95vh; } }
  </style>
</head>
<body>
  <div class="bar"><button onclick="window.print()">🖍️ Imprimir</button></div>
  <img id="pic" src="colorear-melody.png?v=2" alt="Dibujo para colorear de Melody saludando">
  <script>
    document.getElementById('pic').addEventListener('load', function () { setTimeout(function () { window.print(); }, 300); });
  </script>
</body>
</html>
